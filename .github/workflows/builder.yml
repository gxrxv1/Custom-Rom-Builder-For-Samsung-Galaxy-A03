name: Custom Rom Builder Samsung Galaxy A03

permissions:
  contents: write

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      GSI:
        description: 'GSI Image Direct Link'
        required: true
        default: 'https://sourceforge.net/projects/misterztr-gsi/files/PixelOS/Android%2014/VNDK-Lite/PixelOS_treble_arm64_bN-vndklite-14.0-20240824.img.xz/download?use_mirror=twds'

      NAME:
        description: 'Rom Name'
        required: true
        default: 'aosp-arm64-ab-gapps-14.0-a03.7z'

      VERSION:
        description: 'Baseband Version'
        required: true
        default: 'A035FXXS7CXF3'

      VENDOR:
        description: 'Enter Direct Link Of Your Version Vendor'
        required: true
        default: 'https://github.com/Arandomaxo/a035f-vendor-test-file/releases/download/v1.0/vendor.img'

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y zip xz-utils unzip p7zip-full wget

    - name: Installing Tools
      run: |
        git clone https://github.com/Exynos-nigg/lpunpack-lpmake-mirror.git lpbinary
        cd lpbinary
        bash install.sh

    - name: Downloading GSI And Extracting
      run: |
        cd lpbinary/binary

        wget -O gsi.img.xz "${{ github.event.inputs.GSI }}"

        mkdir -p sys
        mv gsi.img.xz sys/
        cd sys

        unxz gsi.img.xz

        IMG=$(ls *.img | head -n 1)

        if [ -z "$IMG" ]; then
          echo "GSI extraction failed"
          ls -lah
          exit 1
        fi

        mv "$IMG" ../system.img
        cd ..

    - name: Preparing Files
      run: |
        cd lpbinary/binary

        wget -O vendor.img "${{ github.event.inputs.VENDOR }}"

        wget -O product.img https://github.com/Arandomaxo/a035f-vendor-test-file/releases/download/v1.0/product.img || true
        wget -O system_ext.img https://github.com/Arandomaxo/a035f-vendor-test-file/releases/download/v1.0/system_ext.img || true

    - name: Packing
      run: |
        cd lpbinary/binary

        ARGS="--metadata-size 65536 \
        --super-name super \
        --metadata-slots 2 \
        --device super:6763315200 \
        --group main:6761218048 \
        --partition system:readonly:$(stat -c%s system.img) --image system=system.img \
        --partition vendor:readonly:$(stat -c%s vendor.img) --image vendor=vendor.img"

        # only add optional partitions if they exist AND are valid
        if [ -f product.img ] && file product.img | grep -q "Android"; then
          ARGS="$ARGS --partition product:readonly:$(stat -c%s product.img) --image product=product.img"
        fi

        if [ -f system_ext.img ] && file system_ext.img | grep -q "Android"; then
          ARGS="$ARGS --partition system_ext:readonly:$(stat -c%s system_ext.img) --image system_ext=system_ext.img"
        fi

        ./lpmake $ARGS --sparse --output super.img

    - name: Creating tar and compressing to 7z
      run: |
        cd lpbinary/binary
        tar -cvf super.tar super.img
        rm -rf super.img
        7z a ${{ github.event.inputs.NAME }} super.tar
        rm -rf super.tar

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: lpbinary/binary/${{ github.event.inputs.NAME }}
        name: ${{ github.event.inputs.NAME }}-${{ github.run_id }}
        tag_name: v${{ github.run_id }}
        body: |
          Device: Samsung Galaxy A03
          Version: ${{ github.event.inputs.VERSION }}
          Rom Name: ${{ github.event.inputs.NAME }}
          Flash: Extract the 7z file and flash through ODIN in AP Section.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
