name: Custom Rom Builder Samsung Galaxy A03

permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      GSI:
        description: 'GSI Image Direct Link' # supports .img, .7z, .xz, .gz, .zip (wait what i have img suppot?)
        required: true
        default: 'https://github.com/naz664/ArrowOS_gsi/releases/download/v2023.10.28/ArrowOS-13.1-arm64_bgN-slim-Unofficial.img.xz'
      NAME:
        description: 'Rom Name' # ig set it to anything you want
        required: true
        default: 'ArrowOS-13.1-arm64_bgN-slim-Unofficial.7z'
      VERSION:
        description: 'Baseband Version' # idk set it as anything ig
        required: true
        default: 'A035FXXS9CYG1'
      VENDOR:
        description: 'Enter Direct Link Of Your Version Vendor' # should keep this as default since its prob compatible with all A03 bit 9 phones
        required: true
        default: 'https://sourceforge.net/projects/a03-file/files/A035FXXS9CYG1/vendor.img'

jobs:
  Build:
    runs-on: ubuntu-latest 

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies # should prob update stuff that is dead in this ubuntu runner, thanks p7zip but uhh, you arent maintained anymore :(
      run: |
        sudo apt update
        sudo apt install -y zip xz-utils unzip 7zip 7zip-rar wget android-sdk-libsparse-utils file  

    - name: Installing Tools # keep this
      run: |
        git clone https://github.com/Exynos-nigg/lpunpack-lpmake-mirror.git lpbinary
        cd lpbinary
        bash install.sh

    - name: Downloading Your GSI And Extracting # file type detect and delete sys; gsi_archive for storage space
      run: |
        cd lpbinary/binary
        wget "${{ github.event.inputs.GSI }}" -O gsi_archive
        mkdir -p sys
        
        FILE_TYPE=$(file -b gsi_archive)
        
        if echo "$FILE_TYPE" | grep -qi '7-zip'; then
          echo "Detected 7z archive. Extracting..."
          7z x gsi_archive -osys/
        elif echo "$FILE_TYPE" | grep -qi 'Zip archive'; then
          echo "Detected Zip archive. Extracting..."
          unzip gsi_archive -d sys/
        elif echo "$FILE_TYPE" | grep -qi 'gzip'; then
          echo "Detected Gzip archive. Extracting..."
          mv gsi_archive sys/gsi.img.gz
          cd sys && gunzip gsi.img.gz && cd ..
        elif echo "$FILE_TYPE" | grep -qi 'XZ'; then
          echo "Detected XZ archive. Extracting..."
          mv gsi_archive sys/gsi.img.xz
          cd sys && unxz gsi.img.xz && cd ..
        else
          echo "Detected raw image or uncompressed file."
          mv gsi_archive sys/system.img
        fi
        
        if [ -f sys/system.img ]; then
          mv sys/system.img system.img
        else
          mv sys/*.img system.img
        fi
        
        rm -rf sys gsi_archive

    - name: Preparing Files # downloading product.img and system_ext.img
      run: |
        cd lpbinary/binary
        wget "${{ github.event.inputs.VENDOR }}" -O vendor.img
        wget https://sourceforge.net/projects/a03-file/files/A035FXXS9CYG1/product.img -O product.img
        wget https://sourceforge.net/projects/a03-file/files/A035FXXS9CYG1/system_ext.img -O system_ext.img 

    - name: Packing # packing to 7z package and delete system.img; vendor.img; product.img and system_ext.img
      run: |
        cd lpbinary/binary
        ./lpmake --metadata-size 65536 --super-name super --metadata-slots 3 --device super:6763315200 --group main:6761218048 --partition system:readonly:$(ls -nl system.img | awk '{print $5}'):main --image system=system.img --partition vendor:readonly:$(ls -nl vendor.img | awk '{print $5}'):main --image vendor=vendor.img --partition product:readonly:$(ls -nl product.img | awk '{print $5}'):main --image product=product.img --partition system_ext:readonly:$(ls -nl system_ext.img | awk '{print $5}'):main --image system_ext=system_ext.img --sparse --output super.img
        # Remove individual raw images immediately after creating super.img to save disk space
        rm -f system.img vendor.img product.img system_ext.img

    - name: Creating tar and compressing to 7z # actual packing to a 7z and also deleting super.img and super.tar
      run: |
        cd lpbinary/binary
        tar -cvf super.tar super.img
        rm -f super.img
        7z a "${{ github.event.inputs.NAME }}" super.tar
        rm -f super.tar

    - name: Upload to Release # uploading to releases
      uses: softprops/action-gh-release@v2
      with:
        files: lpbinary/binary/${{ github.event.inputs.NAME }}
        name: ${{ github.event.inputs.NAME }}-${{ github.run_id }}
        tag_name: build-${{ github.run_id }}
        body: |
          Device: Samsung Galaxy A03
          Version: ${{ github.event.inputs.VERSION }}
          Rom Name: ${{ github.event.inputs.NAME }}
          Flash: Extract the 7z file and flash through ODIN in AP Section.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
